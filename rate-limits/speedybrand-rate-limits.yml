description: >-
  SpeedyBrand publishes NO rate limits. There is no public API to rate-limit: the
  product is a no-code SaaS web application, no developer portal or API reference is
  reachable (see x-coverage in apis.yml), and the only usage-governing document the
  provider publishes is a prose Fair Use Policy that contains no numbers.
  The Fair Use Policy states only that "users with exceptionally high activity levels
  may be subject to transition to a different service model" — a commercial
  escalation clause, not a throttling contract. No response headers, no throttled
  status code, and no per-key/per-account window are documented anywhere, so none are
  recorded. This is an honest zero, not an unchecked field.
