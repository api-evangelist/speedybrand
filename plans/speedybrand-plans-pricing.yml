description: >-
  SpeedyBrand publishes two self-serve seat/subscription tiers on its public pricing
  page, billed monthly with a stated 30% discount when billed annually (the annual
  per-month figure is not printed on the page, so only the monthly price is recorded
  here). Pricing is for the end-user SaaS product; NO tier mentions API access,
  developer features, or programmatic quotas, and there is no published per-call or
  usage-based metering. A separate "AI For Enterprise" page exists and routes to a
  Calendly booking rather than a priced tier, so it is recorded as a contact-sales
  entry with no published price.
plan_count: 2
